name: Deploy to Cloud Run

on:
  push:
    branches:
      - develop

env:
  PROJECT_ID: learned-maker-459200-v6
  REGION: us-central1
  SERVICE_NAME: hola-mundo
  REPO_NAME: cloud-run

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Create Artifact Registry if not exists
      run: |
        gcloud artifacts repositories list --location=$REGION \
        | grep $REPO_NAME || \
        gcloud artifacts repositories create $REPO_NAME \
          --repository-format=docker \
          --location=$REGION \
          --description="Repo para Cloud Run"

    - name: Build and push Docker image
      run: |
        gcloud auth configure-docker $REGION-docker.pkg.dev
        docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME .
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME \
          --platform=managed \
          --region=$REGION \
          --allow-unauthenticated
